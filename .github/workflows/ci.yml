name: AOSFT-MVP CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Initialize database
        run: python scripts/init_db.py
      
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -m "not requires_api"
      
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m "not requires_api"
      
      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --tb=short \
            -m "not requires_api"
  
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linting tools
        run: |
          pip install black flake8 mypy pydantic pandas numpy
      
      - name: Check formatting with black
        run: black --check --diff src/ tests/
      
      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=120 --exclude=__pycache__
      
      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true
  
  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: docker build -t aosft-mvp:latest .
      
      - name: Test Docker container
        run: |
          docker run -d --name aosft-test aosft-mvp:latest
          sleep 5
          docker logs aosft-test
          docker stop aosft-test
