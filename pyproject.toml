[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | venv
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "tests/",
    "scripts/",
]

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "venv", ".venv", "build", "dist"]
per-file-ignores = ["__init__.py:F401"]
